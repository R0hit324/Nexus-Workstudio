name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# The project lives in the `Nexus/` folder at the repository root, so every
# cargo command runs from there.
defaults:
  run:
    working-directory: Nexus

jobs:
  quality:
    name: Formatting, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets

      - name: Unit and component tests
        run: cargo test --workspace --lib

      - name: Integration and protocol tests
        run: cargo test --workspace --tests

      - name: Documentation tests
        run: cargo test --workspace --doc

      - name: Build
        run: cargo build --workspace

  performance:
    name: Performance regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Performance regression tests
        run: cargo test -p nexus-tests-performance --release

  # Future Part 14 layers (security, chaos, stress, soak) run as separate
  # jobs so heavy workloads do not gate every pull request. They are added
  # here as their harnesses land.
