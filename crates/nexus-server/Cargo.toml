[package]
name = "nexus-server"
description = "The Nexus server: authoritative source of truth for Cubes, workspaces, and collaboration state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nexus-server"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
postcard = { workspace = true }
rand = "0.8"
parking_lot = "0.12"
nexus-core = { path = "../nexus-core" }
nexus-plugin = { path = "../nexus-plugin" }
nexus-protocol = { path = "../nexus-protocol" }
nexus-events = { path = "../nexus-events" }
nexus-snapshot = { path = "../nexus-snapshot" }
nexus-sync = { path = "../nexus-sync" }
nexus-build = { path = "../nexus-build" }
nexus-terminal = { path = "../nexus-terminal" }

[dev-dependencies]
tempfile = "3"