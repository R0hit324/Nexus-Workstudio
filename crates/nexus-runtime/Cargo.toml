[package]
name = "nexus-runtime"
description = "Isolated Cube runtimes: lifecycle management, Docker backend, resource limits, port allocation, and process orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
docker-api = { version = "0.13", default-features = false }
notify = "6"
glob = "0.3"
parking_lot = "0.12"
nexus-core = { path = "../nexus-core" }
nexus-sync = { path = "../nexus-sync" }
nexus-events = { path = "../nexus-events" }

[dev-dependencies]
tempfile = "3"